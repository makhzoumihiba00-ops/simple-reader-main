<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF Viewer</title>
<style>
    body { margin: 0; background: #334155; font-family: sans-serif; }
    .page-label { color: #e2e8f0; font-weight: 700; font-size: 18px; padding: 10px 16px 4px; }
    canvas { display: block; margin: 0 16px 24px; box-shadow: 0 4px 20px rgba(0,0,0,.4); }
    #status { color: #e2e8f0; padding: 12px 16px; font-size: 15px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div id="status">Loading…</div>
<div id="pages"></div>
<script>
(async () => {
    const params = new URLSearchParams(location.search);
    const from = parseInt(params.get('from') || '1', 10);
    const to = parseInt(params.get('to') || String(from), 10);
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const doc = await pdfjsLib.getDocument({ url: 'slides.pdf' }).promise;
    const container = document.getElementById('pages');
    document.getElementById('status').textContent = `PDF loaded: ${doc.numPages} pages — showing ${from}–${to}`;
    for (let i = from; i <= Math.min(to, doc.numPages); i++) {
        const page = await doc.getPage(i);
        const base = page.getViewport({ scale: 1 });
        const scale = 1180 / base.width;
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        const label = document.createElement('div');
        label.className = 'page-label';
        label.textContent = `— PDF PAGE ${i} —`;
        container.appendChild(label);
        container.appendChild(canvas);
    }
    window.__renderDone = true;
})().catch((e) => {
    document.getElementById('status').textContent = 'ERROR: ' + e.message;
});
</script>
</body>
</html>
