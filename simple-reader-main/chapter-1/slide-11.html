<!DOCTYPE html>
<html lang="en" class="bec-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lesson.css">
    <script src="lesson.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div class="bec-slide">
    <div class="bec-glow"></div>
    <main class="bec-main">
        <header class="bec-header">
            <h1 class="bec-title">Vocabulary <span class="bec-title-accent">Practice</span></h1>
            <p class="bec-subtitle">Choose the correct answer</p>
        </header>
        <div id="quiz-mount" style="display:flex; flex-direction:column; flex:1 1 auto; min-height:0; width:100%; align-items:center;"></div>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var quiz = new BEC.Quiz(document.getElementById('quiz-mount'), {
            questions: [
                {
                    text: 'The amount of money you have in a bank is called:',
                    options: ['Balance', 'Bank statement', 'Bank transfer'],
                    answer: 0,
                    hint: 'It is the money in your account.'
                },
                {
                    text: 'When you move money from one bank to another is:',
                    options: ['Bank statement', 'Withdraw', 'Transfer'],
                    answer: 2,
                    hint: 'You move money from one account to another.'
                },
                {
                    text: 'To take out money from your bank account is:',
                    options: ['Deposit', 'Transfer', 'Overdraw'],
                    answer: 2,
                    hint: 'This word means taking money out — careful, it is more than you have!'
                },
                {
                    text: 'A document to show how much money you have is a:',
                    options: ['Bank transfer', 'Bank statement', 'Withdraw'],
                    answer: 1,
                    hint: 'It is a paper that shows your money.'
                },
                {
                    text: 'Money going in and out of a bank account is called:',
                    options: ['Deposit', 'Withdraw', 'Transaction'],
                    answer: 2,
                    hint: 'One word for money in AND out.'
                }
            ]
        });

        window.resetSlide = function () { quiz.restart(); };
        BEC.entrance('.bec-header');
    });
</script>
</body>
</html>
