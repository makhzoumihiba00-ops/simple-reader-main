<!DOCTYPE html>
<html lang="en" class="bec-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary – Paying Bills and Banking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lesson.css">
    <script src="lesson.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div class="bec-slide">
    <div class="bec-glow"></div>
    <main class="bec-main">
        <header class="bec-header" style="margin-bottom:4px;">
            <h1 class="bec-title" style="font-size:clamp(21px,3.55vh,31px);">Vocabulary – <span class="bec-title-accent">Paying Bills and Banking</span></h1>
            <p class="bec-subtitle" style="margin-top:2px;">Click on cards to listen and practice pronunciation</p>
        </header>

        <div class="bec-vocab-area">
            <div class="bec-vocab-grid" id="vocab-grid"></div>
            <div class="bec-vocab-pager" id="vocab-pager"></div>
        </div>
    </main>
</div>

<script>
    /* ==================================================================
       MEDIA INTEGRATION — TECH LEAD ONLY
       Card images: each word has a platform-style SVG illustration drawn
       in code (same art family as the cover and objectives cards). If
       real photos are provided later, map a word to its image URL in
       WORD_IMAGE and the card renders the photo instead — e.g.
       WORD_IMAGE['deposit'] = 'deposit.jpg';
       Word audio: same idea with WORD_AUDIO[word] = 'https://…/deposit.mp3';
       Speaker buttons stay disabled until a URL is mapped. No TTS.
       ================================================================== */
    var WORD_IMAGE = {};
    var WORD_AUDIO = {};

    /* Hand-drawn flat illustrations, one per word (viewBox 320x160 = card band) */
    var WORD_ART = {
        'saving account / current account':
            '<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<ellipse cx="160" cy="85" rx="120" ry="62" fill="#818cf8" opacity="0.12"/>' +
            '<ellipse cx="160" cy="88" rx="62" ry="42" fill="#6366f1"/>' +
            '<path d="M120 62l14-12 8 12z" fill="#4f46e5"/>' +
            '<circle cx="206" cy="88" r="16" fill="#e0e7ff"/><circle cx="206" cy="88" r="7" fill="#6366f1"/>' +
            '<rect x="140" y="42" width="40" height="7" rx="3.5" fill="#312e81"/>' +
            '<rect x="112" cy="122" width="14" height="12" rx="4" fill="#4f46e5"/><rect x="194" cy="122" width="14" height="12" rx="4" fill="#4f46e5"/>' +
            '<circle cx="160" cy="30" r="13" fill="#fbbf24"/><text x="160" y="35" text-anchor="middle" fill="#fff" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="13">$</text>' +
            '</svg>',
        'deposit':
            '<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<ellipse cx="160" cy="85" rx="120" ry="62" fill="#818cf8" opacity="0.12"/>' +
            '<rect x="92" y="62" width="136" height="86" rx="14" fill="#6366f1"/>' +
            '<rect x="108" y="78" width="34" height="24" rx="5" fill="#fbbf24"/><path d="M114 78v24M122 78v24M130 78v24" stroke="#f59e0b" stroke-width="2"/>' +
            '<text x="112" y="126" fill="#fff" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="11" letter-spacing="1.5">ACCOUNT</text>' +
            '<path d="M160 6v38M160 50l-10-11M160 50l10-11" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>' +
            '<circle cx="160" cy="18" r="0" fill="none"/>' +
            '</svg>',
        'withdraw':
            '<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<ellipse cx="160" cy="90" rx="120" ry="60" fill="#818cf8" opacity="0.12"/>' +
            '<rect x="98" y="96" width="124" height="46" rx="10" fill="#94a3b8"/>' +
            '<path d="M98 108h124" stroke="#64748b" stroke-width="6"/>' +
            '<rect x="118" y="46" width="84" height="42" rx="6" fill="#16a34a"/>' +
            '<circle cx="160" cy="67" r="12" fill="#dcfce7"/><text x="160" y="72" text-anchor="middle" fill="#16a34a" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="12">$</text>' +
            '<path d="M160 98V70M160 62l-9 10M160 62l9 10" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>',
        'bank statement':
            '<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<ellipse cx="160" cy="85" rx="120" ry="62" fill="#818cf8" opacity="0.12"/>' +
            '<rect x="106" y="22" width="108" height="120" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>' +
            '<rect x="106" y="22" width="108" height="20" rx="10" fill="#6366f1"/><rect x="106" y="34" width="108" height="8" fill="#6366f1"/>' +
            '<circle cx="124" cy="60" r="7" fill="#16a34a"/><path d="M121.5 60l2 2 3.5-4" stroke="#fff" stroke-width="1.6" fill="none"/><rect x="138" y="56" width="62" height="7" rx="3.5" fill="#e2e8f0"/>' +
            '<circle cx="124" cy="82" r="7" fill="#dc2626"/><path d="M121 82h6" stroke="#fff" stroke-width="1.8"/>' +
            '<rect x="138" y="78" width="50" height="7" rx="3.5" fill="#e2e8f0"/>' +
            '<circle cx="124" cy="104" r="7" fill="#16a34a"/><path d="M121.5 104l2 2 3.5-4" stroke="#fff" stroke-width="1.6" fill="none"/><rect x="138" y="100" width="58" height="7" rx="3.5" fill="#e2e8f0"/>' +
            '<rect x="122" y="120" width="76" height="10" rx="5" fill="#eef2ff"/>' +
            '</svg>',
        'balance':
            '<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<ellipse cx="160" cy="85" rx="120" ry="62" fill="#818cf8" opacity="0.12"/>' +
            '<rect x="154" y="36" width="12" height="86" rx="5" fill="#4f46e5"/>' +
            '<rect x="120" y="118" width="80" height="12" rx="5" fill="#6366f1"/>' +
            '<rect x="96" y="40" width="128" height="9" rx="4.5" fill="#6366f1"/>' +
            '<circle cx="160" cy="44" r="8" fill="#4f46e5"/>' +
            '<path d="M96 49l-20 26h40z" fill="none" stroke="#818cf8" stroke-width="3"/><path d="M76 75a20 20 0 0 0 40 0" fill="#e0e7ff" stroke="#818cf8" stroke-width="3"/>' +
            '<path d="M224 49l-20 26h40z" fill="none" stroke="#818cf8" stroke-width="3"/><path d="M204 75a20 20 0 0 0 40 0" fill="#e0e7ff" stroke="#818cf8" stroke-width="3"/>' +
            '<circle cx="96" cy="68" r="9" fill="#fbbf24"/><circle cx="224" cy="68" r="9" fill="#fbbf24"/>' +
            '</svg>',
        'sign':
            '<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<ellipse cx="160" cy="85" rx="120" ry="62" fill="#818cf8" opacity="0.12"/>' +
            '<rect x="100" y="26" width="120" height="110" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>' +
            '<rect x="116" y="42" width="60" height="8" rx="4" fill="#c7d2fe"/><rect x="116" y="58" width="88" height="6" rx="3" fill="#e2e8f0"/>' +
            '<path d="M116 102c8-14 14 6 22-6s12 8 20-4 12 6 20-4" stroke="#4f46e5" stroke-width="3.5" fill="none" stroke-linecap="round"/>' +
            '<path d="M116 116h88" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 5"/>' +
            '<g transform="rotate(40 210 84)"><rect x="196" y="52" width="14" height="62" rx="6" fill="#4f46e5"/><rect x="196" y="52" width="14" height="16" rx="6" fill="#312e81"/><path d="M200 114l3 12 5-11z" fill="#312e81"/></g>' +
            '</svg>',
        'transfer':
            '<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<ellipse cx="160" cy="85" rx="120" ry="62" fill="#818cf8" opacity="0.12"/>' +
            '<rect x="46" y="52" width="88" height="56" rx="10" fill="#6366f1"/><rect x="58" y="62" width="20" height="14" rx="4" fill="#fbbf24"/><rect x="58" y="86" width="52" height="7" rx="3.5" fill="#e0e7ff"/>' +
            '<rect x="186" y="52" width="88" height="56" rx="10" fill="#38bdf8"/><rect x="198" y="62" width="20" height="14" rx="4" fill="#fbbf24"/><rect x="198" y="86" width="52" height="7" rx="3.5" fill="#e0f2fe"/>' +
            '<path d="M140 66h40M174 58l10 8-10 8" stroke="#4f46e5" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
            '<path d="M180 96h-40M146 88l-10 8 10 8" stroke="#0ea5e9" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>',
        'overdraw':
            '<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<ellipse cx="160" cy="85" rx="120" ry="62" fill="#818cf8" opacity="0.12"/>' +
            '<rect x="102" y="34" width="116" height="16" rx="8" fill="#6366f1"/><text x="160" y="47" text-anchor="middle" fill="#fff" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="11">$0</text>' +
            '<path d="M160 58v52M160 116l-12-13M160 116l12-13" stroke="#dc2626" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>' +
            '<rect x="106" y="124" width="108" height="22" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>' +
            '<circle cx="128" cy="135" r="7" fill="#e2e8f0"/><circle cx="148" cy="135" r="7" fill="#e2e8f0"/>' +
            '<text x="196" y="140" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="10">EMPTY</text>' +
            '</svg>',
        'bank branch':
            '<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<ellipse cx="160" cy="88" rx="120" ry="60" fill="#818cf8" opacity="0.12"/>' +
            '<path d="M96 62L160 24l64 38z" fill="#6366f1"/>' +
            '<rect x="104" y="66" width="14" height="52" rx="4" fill="#a5b4fc"/><rect x="132" y="66" width="14" height="52" rx="4" fill="#a5b4fc"/><rect x="174" y="66" width="14" height="52" rx="4" fill="#a5b4fc"/><rect x="202" y="66" width="14" height="52" rx="4" fill="#a5b4fc"/>' +
            '<rect x="160" y="66" width="0" height="0" fill="none"/>' +
            '<rect x="96" y="118" width="128" height="14" rx="5" fill="#4f46e5"/>' +
            '<rect x="126" y="36" width="68" height="14" rx="7" fill="#eef2ff"/><text x="160" y="47" text-anchor="middle" fill="#4f46e5" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="10" letter-spacing="1">BANK</text>' +
            '</svg>',
        'transactions':
            '<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<ellipse cx="160" cy="85" rx="120" ry="62" fill="#818cf8" opacity="0.12"/>' +
            '<circle cx="160" cy="82" r="26" fill="#fbbf24"/><circle cx="160" cy="82" r="16" fill="#fde68a"/><text x="160" y="88" text-anchor="middle" fill="#b45309" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="16">$</text>' +
            '<path d="M112 60a56 56 0 0 1 74-22" stroke="#16a34a" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M186 30l-2 12-12-3z" fill="#16a34a"/>' +
            '<path d="M208 104a56 56 0 0 1-74 22" stroke="#dc2626" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M134 134l2-12 12 3z" fill="#dc2626"/>' +
            '</svg>',
        'ATM':
            '<svg viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">' +
            '<ellipse cx="160" cy="85" rx="120" ry="62" fill="#818cf8" opacity="0.12"/>' +
            '<rect x="112" y="20" width="96" height="112" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>' +
            '<rect x="124" y="32" width="72" height="32" rx="7" fill="#0f172a"/><text x="160" y="53" text-anchor="middle" fill="#7dd3fc" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="13" letter-spacing="2">ATM</text>' +
            '<rect x="124" y="72" width="44" height="8" rx="4" fill="#e2e8f0"/>' +
            '<rect x="124" y="88" width="72" height="14" rx="5" fill="#4f46e5"/>' +
            '<rect x="216" y="60" width="30" height="20" rx="4" fill="#6366f1"/><path d="M212 70h-6" stroke="#6366f1" stroke-width="4"/>' +
            '<rect x="126" y="118" width="58" height="10" rx="4" fill="#16a34a" opacity="0.9"/>' +
            '</svg>'
    };

    var WORDS = [
        { word: 'saving account / current account', meaning: 'a bank account for saving money / for everyday use', example: 'I keep my savings in a saving account.' },
        { word: 'deposit', meaning: 'to put money into a bank account', example: 'I want to deposit some money.' },
        { word: 'withdraw', meaning: 'to take money out of a bank account', example: 'I need to withdraw some cash.' },
        { word: 'bank statement', meaning: 'a paper that shows all the money in and out of your account', example: 'I read my bank statement every month.' },
        { word: 'balance', meaning: 'the money in your account', example: 'I would like to check my balance.' },
        { word: 'sign', meaning: 'to write your name on a document', example: 'Please sign here.' },
        { word: 'transfer', meaning: 'to move money from one account to another', example: "Can you transfer money to my friend's account?" },
        { word: 'overdraw', meaning: 'to take more money than you have in your account', example: "Don't overdraw your account." },
        { word: 'bank branch', meaning: 'one office of a bank in a city', example: 'I go to the bank branch near my house.' },
        { word: 'transactions', meaning: 'the money you pay in or take out of your account', example: 'The statement lists all my transactions.' },
        { word: 'ATM', meaning: 'a machine that gives you money from your account', example: 'You can withdraw cash at the ATM.' }
    ];

    var PER_PAGE = 6;
    var PAGES = [];
    for (var p = 0; p < Math.ceil(WORDS.length / PER_PAGE); p++) {
        PAGES.push(WORDS.slice(p * PER_PAGE, (p + 1) * PER_PAGE));
    }
    var pageIdx = 0;

    function renderPage() {
        var grid = document.getElementById('vocab-grid');
        grid.innerHTML = '';
        PAGES[pageIdx].forEach(function (item) {
            var card = BEC.el('div', 'bec-wordcard');

            var imgWrap = BEC.el('div', 'bec-wordcard-img');
            var imgUrl = WORD_IMAGE[item.word];
            if (imgUrl) {
                var img = document.createElement('img');
                img.src = imgUrl;
                img.alt = item.word;
                img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
                imgWrap.appendChild(img);
            } else if (WORD_ART[item.word]) {
                imgWrap.innerHTML = WORD_ART[item.word];
                imgWrap.firstChild.style.cssText = 'width:100%;height:100%;display:block;';
            } else {
                imgWrap.appendChild(BEC.icon('image'));
            }
            card.appendChild(imgWrap);

            var body = BEC.el('div', 'bec-wordcard-body');
            var top = BEC.el('div', 'bec-wordcard-top');
            top.appendChild(BEC.el('span', 'bec-wordcard-word', item.word));
            var speak = BEC.el('button', 'bec-speak');
            speak.type = 'button';
            speak.setAttribute('aria-label', 'Listen: ' + item.word);
            speak.appendChild(BEC.icon('speaker'));
            var audioUrl = WORD_AUDIO[item.word];
            if (audioUrl) {
                var audio = new Audio(audioUrl);
                audio.preload = 'none';
                speak.addEventListener('click', function () {
                    audio.currentTime = 0;
                    audio.play().catch(function () {});
                });
                window.__vocabPlayers.push(audio);
            } else {
                speak.disabled = true;
                speak.title = 'Audio will be connected when the hosted file is available';
            }
            top.appendChild(speak);
            body.appendChild(top);
            body.appendChild(BEC.el('span', 'bec-wordcard-meaning', item.meaning));
            body.appendChild(BEC.el('span', 'bec-wordcard-example', '"' + item.example + '"'));
            card.appendChild(body);
            grid.appendChild(card);
        });

        var pager = document.getElementById('vocab-pager');
        pager.innerHTML = '';
        if (PAGES.length > 1) {
            var prev = BEC.el('button', 'bec-btn bec-btn-ghost', '‹');
            prev.type = 'button';
            prev.setAttribute('aria-label', 'Previous words');
            prev.disabled = pageIdx === 0;
            prev.addEventListener('click', function () { pageIdx--; renderPage(); });
            pager.appendChild(prev);
        }
        pager.appendChild(BEC.el('span', null, (pageIdx + 1) + ' / ' + PAGES.length));
        if (PAGES.length > 1) {
            var next = BEC.el('button', 'bec-btn bec-btn-ghost', '›');
            next.type = 'button';
            next.setAttribute('aria-label', 'More words');
            next.disabled = pageIdx === PAGES.length - 1;
            next.addEventListener('click', function () { pageIdx++; renderPage(); });
            pager.appendChild(next);
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        window.__vocabPlayers = [];
        renderPage();

        window.stopSlideAudio = function () {
            (window.__vocabPlayers || []).forEach(function (a) { a.pause(); a.currentTime = 0; });
        };
        window.resetSlide = function () {
            window.stopSlideAudio();
            pageIdx = 0;
            renderPage();
        };

        BEC.entrance('.bec-header, .bec-vocab-area');
    });
</script>
</body>
</html>
