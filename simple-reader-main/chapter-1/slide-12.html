<!DOCTYPE html>
<html lang="en" class="bec-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fill in the blanks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lesson.css">
    <script src="lesson.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div class="bec-slide">
    <div class="bec-glow"></div>
    <main class="bec-main">
        <header class="bec-header" style="margin-bottom:5px;">
            <h1 class="bec-title" style="font-size:clamp(21px,3.55vh,31px);">Fill in the blanks with the <span class="bec-title-accent">correct word</span></h1>
        </header>

        <div class="bec-bank" id="word-bank"></div>

        <div class="bec-sentences" id="sentences"></div>
        <div class="bec-feedback" id="feedback" style="text-align:center;"></div>

        <div class="bec-controls" style="margin-top:6px;">
            <button type="button" class="bec-btn bec-btn-primary" id="check-btn">Check Answers</button>
            <button type="button" class="bec-btn bec-btn-ghost" id="show-btn">Show Answers</button>
            <button type="button" class="bec-btn bec-btn-ghost" id="reset-btn">Reset</button>
        </div>
    </main>
</div>

<script>
    var BANK = ['active', 'computer system', 'cash', 'form', 'account', 'email', 'signature', 'deposit', 'ID card'];

    /* Each sentence: parts = text around the blanks; answers = one word per blank.
       A sentence with N blanks has N+1 parts. */
    var SENTENCES = [
        { parts: ['The customer went to the bank to open a new', '.'], answers: ['account'] },
        { parts: ['The worker asked for his', 'to check who he was.'], answers: ['ID card'] },
        { parts: ['He filled out a', 'and gave a', '.'], answers: ['form', 'signature'] },
        { parts: ['Then the worker asked how much he wanted to', '.'], answers: ['deposit'] },
        { parts: ['He gave $500 in', '.'], answers: ['cash'] },
        { parts: ['The worker put everything into the', '.'], answers: ['computer system'] },
        { parts: ['He said the account would be', 'soon.'], answers: ['active'] },
        { parts: ['He also said the customer would get an', 'soon.'], answers: ['email'] }
    ];

    var BLANKS = [];   /* flat list: { word: correct answer } in reading order (1..9) */
    SENTENCES.forEach(function (s) {
        s.answers.forEach(function (a) { BLANKS.push({ answer: a }); });
    });

    var filled = [];   /* BANK index placed in each blank (global order), or null */
    var selectNextBlank = null;

    function bankUsed(wi) { return filled.indexOf(wi) !== -1; }

    function renderBank() {
        var bank = document.getElementById('word-bank');
        bank.innerHTML = '';
        BANK.forEach(function (word, wi) {
            var chip = BEC.el('button', 'bec-chip', word);
            chip.type = 'button';
            chip.disabled = bankUsed(wi);
            chip.addEventListener('click', function () { placeWord(wi); });
            bank.appendChild(chip);
        });
    }

    function renderSentences(state) {
        var box = document.getElementById('sentences');
        box.innerHTML = '';
        var blankIdx = 0;
        SENTENCES.forEach(function (s, si) {
            var row = BEC.el('div', 'bec-sentence');
            s.parts.forEach(function (part, pi) {
                if (pi > 0) {
                    /* blank pi-1 of this sentence */
                    var globalIdx = blankIdx;
                    blankIdx++;
                    var blank = BEC.el('button', 'bec-blank');
                    blank.type = 'button';
                    var wi = filled[globalIdx];
                    if (wi != null) {
                        blank.textContent = BANK[wi];
                        blank.classList.add('is-filled');
                        if (state === 'checked' || state === 'revealed') {
                            blank.disabled = true;
                            if (BANK[wi] === s.answers[pi - 1]) blank.classList.add('is-correct');
                            else blank.classList.add('is-wrong');
                        } else {
                            blank.addEventListener('click', function () { removeWord(globalIdx); });
                        }
                    } else if (state === 'revealed') {
                        blank.textContent = s.answers[pi - 1];
                        blank.classList.add('is-filled', 'is-correct');
                        filled[globalIdx] = BANK.indexOf(s.answers[pi - 1]);
                    } else {
                        blank.textContent = (globalIdx + 1);
                        blank.style.color = 'var(--muted)';
                        blank.style.fontWeight = '800';
                        blank.addEventListener('click', function () { selectNextBlank = globalIdx; });
                    }
                    row.appendChild(blank);
                }
                if (part) row.appendChild(BEC.el('span', null, part));
            });
            box.appendChild(row);
        });
    }

    function placeWord(wi) {
        var target = null;
        if (selectNextBlank != null && filled[selectNextBlank] == null) {
            target = selectNextBlank;
        } else {
            for (var i = 0; i < BLANKS.length; i++) {
                if (filled[i] == null) { target = i; break; }
            }
        }
        if (target == null) return;
        filled[target] = wi;
        selectNextBlank = null;
        refresh(null);
    }

    function removeWord(globalIdx) {
        filled[globalIdx] = null;
        refresh(null);
    }

    function refresh(state) {
        renderBank();
        renderSentences(state);
        var fb = document.getElementById('feedback');
        fb.className = 'bec-feedback';
        fb.textContent = '';
        if (state === 'checked') {
            var correct = 0;
            BLANKS.forEach(function (b, i) {
                if (filled[i] != null && BANK[filled[i]] === b.answer) correct++;
            });
            fb.textContent = 'You got ' + correct + ' of ' + BLANKS.length + ' correct.';
            fb.classList.add(correct === BLANKS.length ? 'bec-ok' : 'bec-bad');
        } else if (state === 'revealed') {
            fb.textContent = 'Answers shown.';
            fb.classList.add('bec-bad');
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        filled = BLANKS.map(function () { return null; });
        refresh(null);

        document.getElementById('check-btn').addEventListener('click', function () {
            if (filled.indexOf(null) !== -1) {
                var fb = document.getElementById('feedback');
                fb.className = 'bec-feedback bec-bad';
                fb.textContent = 'Fill all the blanks first.';
                return;
            }
            refresh('checked');
        });
        document.getElementById('show-btn').addEventListener('click', function () {
            filled = BLANKS.map(function () { return null; });
            refresh('revealed');
            renderBank();
        });
        document.getElementById('reset-btn').addEventListener('click', function () {
            filled = BLANKS.map(function () { return null; });
            selectNextBlank = null;
            refresh(null);
        });

        window.resetSlide = function () {
            filled = BLANKS.map(function () { return null; });
            selectNextBlank = null;
            refresh(null);
        };

        BEC.entrance('.bec-header, .bec-bank, .bec-sentences, .bec-controls');
    });
</script>
</body>
</html>
