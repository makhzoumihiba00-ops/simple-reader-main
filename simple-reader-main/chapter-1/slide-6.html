<!DOCTYPE html>
<html lang="en" class="bec-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video comprehension</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lesson.css">
    <script src="lesson.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div class="bec-slide">
    <div class="bec-glow"></div>
    <main class="bec-main">
        <header class="bec-header">
            <h1 class="bec-title">Video <span class="bec-title-accent">comprehension</span></h1>
            <p class="bec-subtitle">Answer the questions about the video</p>
        </header>
        <div id="quiz-mount" style="display:flex; flex-direction:column; flex:1 1 auto; min-height:0; width:100%; align-items:center;"></div>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        var quiz = new BEC.Quiz(document.getElementById('quiz-mount'), {
            questions: [
                {
                    text: 'Why does the customer go to the bank?',
                    options: ['To open a new account', 'To pay the electric bill', 'To buy a new card', 'To send a letter'],
                    answer: 1,
                    hint: "He says: 'I need to pay my electric bill.'"
                },
                {
                    text: 'What does the teller ask the customer to show?',
                    options: ['A passport', 'The bill', 'A photo', 'A phone'],
                    answer: 1,
                    hint: "The teller asks: 'Do you have your bill with you?'"
                },
                {
                    text: 'How much is the bill?',
                    options: ['45.60 dollars', '15 dollars', '100 dollars', '5.60 dollars'],
                    answer: 0,
                    hint: 'The teller says the total out loud.'
                },
                {
                    text: 'How does the customer pay?',
                    options: ['By cash', 'By check', 'By card', 'Online'],
                    answer: 2,
                    hint: "The customer says 'please' after choosing."
                },
                {
                    text: 'What does the teller give at the end?',
                    options: ['A new account', 'A receipt', 'A bill', 'A credit card'],
                    answer: 1,
                    hint: "The teller says: 'All done! Here is your…'"
                }
            ]
        });

        window.resetSlide = function () { quiz.restart(); };
        BEC.entrance('.bec-header');
    });
</script>
</body>
</html>
