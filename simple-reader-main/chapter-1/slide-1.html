<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston English Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui']
                    }
                }
            }
        };

        (function applyInitialTheme() {
            let useDark = false;
            try {
                if (window.parent && window.parent !== window) {
                    useDark = window.parent.document.documentElement.classList.contains('dark');
                }
            } catch (e) {}

            if (!useDark) {
                const saved = localStorage.getItem('theme-preference');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                useDark = saved ? saved === 'dark' : prefersDark;
            }

            document.documentElement.classList.toggle('dark', useDark);
        })();

        window.setTheme = function setTheme(theme) {
            const useDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', useDark);
            localStorage.setItem('theme-preference', useDark ? 'dark' : 'light');
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        .dot-grid {
            background-image: radial-gradient(rgba(99, 102, 241, 0.16) 1.5px, transparent 1.5px);
            background-size: 26px 26px;
        }
        .ghost-number {
            -webkit-text-stroke: 2px rgba(148, 163, 184, 0.28);
            color: transparent;
            font-weight: 900;
            line-height: 0.8;
            letter-spacing: -0.06em;
            user-select: none;
        }
        .dark .ghost-number {
            -webkit-text-stroke: 2px rgba(148, 163, 184, 0.18);
        }
        .idiom-quote::before {
            content: '“';
            position: absolute;
            top: -28px;
            left: 6px;
            font-size: 7rem;
            font-weight: 900;
            line-height: 1;
            color: rgba(255, 255, 255, 0.14);
        }
        .chip {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .chip:hover {
            transform: translateY(-2px);
        }

        /* Short two-column stages (e.g. 1280x720 / 1024x768 reader windows):
           tighten vertical rhythm of the approved cover so it fits without
           scrolling. Narrow (stacked) screens keep the platform's standard
           cover behavior. */
        @media (min-width: 640px) and (max-height: 830px) {
            .slide-content { padding-top: 0.75rem !important; padding-bottom: 0.75rem !important; }
            .lesson-label { margin-top: 0.35rem !important; margin-bottom: 0.45rem !important; }
            .hero-title { margin-bottom: 0.8rem !important; font-size: clamp(2.6rem, 6.2vh, 3.6rem) !important; }
            .hero-subtitle { margin-bottom: 1rem !important; }
            .idiom-card { padding: 1.15rem 1.35rem 1rem !important; }
            .idiom-quote { font-size: 1.3rem !important; }
            .idiom-label { margin-bottom: 0.4rem !important; }
            #chips-line { margin-top: 0.9rem !important; }
            #meta-line { margin-bottom: 0 !important; }
        }
    </style>
</head>
<body class="h-full overflow-x-hidden">
<div class="isolate relative min-h-[100dvh] overflow-x-hidden overflow-y-auto bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50">
    <div class="pointer-events-none fixed inset-0 z-0">
        <div class="absolute -top-28 -left-28 h-80 w-80 rounded-full bg-indigo-500/15 blur-3xl dark:bg-indigo-500/25"></div>
        <div class="absolute -bottom-36 -right-28 h-96 w-96 rounded-full bg-blue-500/10 blur-3xl dark:bg-blue-500/20"></div>
        <div class="absolute left-1/2 top-[85%] -translate-x-1/2 h-[28rem] w-[28rem] rounded-full bg-emerald-500/10 blur-3xl dark:bg-emerald-500/15"></div>
        <div class="dot-grid absolute left-0 top-0 h-56 w-72 opacity-60 dark:opacity-30"></div>
    </div>

    <div class="relative z-10">
        <div class="relative min-h-[100dvh] w-full overflow-x-hidden overflow-y-auto">
            <div class="mx-auto flex min-h-[100dvh] w-full max-w-[1200px] items-center px-6 py-10 lg:px-16 lg:py-14">
                <div class="slide-content grid w-full grid-cols-1 items-center gap-10 sm:grid-cols-[1.05fr_0.95fr] sm:gap-8 lg:gap-12">

                    <!-- LEFT: lesson intro -->
                    <div class="text-section z-10 text-center sm:text-left">
                        <div class="flex items-center justify-center gap-3 opacity-0 sm:justify-start" id="meta-line">
                            <span class="inline-flex items-center gap-2 rounded-full border border-indigo-100 bg-indigo-50 px-4 py-1.5 text-[0.7rem] font-extrabold uppercase tracking-[0.18em] text-indigo-600 dark:border-indigo-500/30 dark:bg-indigo-500/15 dark:text-indigo-300">
                                <span class="h-1.5 w-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
                                A1 · Beginner
                            </span>
                            <span class="text-[0.7rem] font-black uppercase tracking-[0.18em] text-slate-400 dark:text-slate-500">
                                Unit 04 · Lesson 03
                            </span>
                        </div>

                        <p class="lesson-label mb-4 mt-6 text-xs font-black uppercase tracking-[0.35em] text-indigo-500 dark:text-indigo-400 opacity-0">
                            Home and Daily Needs
                        </p>

                        <h1 class="hero-title mb-6 text-5xl font-black leading-[0.95] tracking-[-0.045em] opacity-0 sm:text-6xl lg:text-6xl xl:text-7xl">
                            Paying
                            <span class="bg-gradient-to-br from-indigo-600 via-blue-500 to-cyan-400 bg-clip-text text-transparent dark:from-indigo-400 dark:via-blue-400 dark:to-cyan-300">Bills</span>
                        </h1>

                        <p class="hero-subtitle mx-auto mb-8 max-w-[440px] text-base font-medium leading-relaxed text-slate-500 opacity-0 sm:text-lg sm:mx-0 dark:text-slate-400">
                            Learn how to talk about bills, payments, and spending your money wisely.
                        </p>

                        <div class="idiom-card relative mx-auto max-w-[520px] overflow-hidden rounded-[1.8rem] bg-gradient-to-br from-indigo-600 via-indigo-600 to-blue-700 p-8 pt-10 text-left opacity-0 shadow-[0_40px_80px_-30px_rgba(79,70,229,0.55)] ring-1 ring-white/20 sm:mx-0">
                            <div class="pointer-events-none absolute -right-12 -top-12 h-44 w-44 rounded-full bg-white/10 blur-2xl"></div>
                            <div class="pointer-events-none absolute -bottom-16 -left-10 h-40 w-40 rounded-full bg-cyan-400/20 blur-2xl"></div>

                            <p class="idiom-label relative mb-4 flex items-center gap-3 text-[0.68rem] font-black uppercase tracking-[0.3em] text-indigo-200">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>
                                    <circle cx="12" cy="12" r="4"/>
                                </svg>
                                Idiom of the lesson
                            </p>
                            <p class="idiom-quote relative text-[1.65rem] font-black leading-snug tracking-tight text-white sm:text-3xl">
                                Cut your coat according to your cloth
                            </p>
                            <div class="mt-6 flex items-center gap-2.5 border-t border-white/15 pt-4 text-sm font-bold text-indigo-200">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                </svg>
                                What do you think it means?
                            </div>
                        </div>

                        <div class="mt-8 flex flex-wrap items-center justify-center gap-2.5 opacity-0 sm:justify-start" id="chips-line">
                            <span class="chip rounded-full border border-slate-200 bg-white px-4 py-1.5 text-[0.7rem] font-extrabold uppercase tracking-[0.12em] text-slate-500 shadow-sm dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300">Vocabulary</span>
                            <span class="chip rounded-full border border-slate-200 bg-white px-4 py-1.5 text-[0.7rem] font-extrabold uppercase tracking-[0.12em] text-slate-500 shadow-sm dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300">Speaking</span>
                            <span class="chip rounded-full border border-slate-200 bg-white px-4 py-1.5 text-[0.7rem] font-extrabold uppercase tracking-[0.12em] text-slate-500 shadow-sm dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300">Real-life practice</span>
                        </div>
                    </div>

                    <!-- RIGHT: illustration stage -->
                    <div class="image-section relative flex items-center justify-center opacity-0 sm:justify-center">
                        <span class="ghost-number pointer-events-none absolute top-[30%] -right-2 text-[10rem] sm:text-[11rem]">03</span>

                        <svg id="illustration" class="relative h-auto w-full max-w-[320px] sm:max-w-[380px] md:max-w-[420px] lg:max-w-[440px]" viewBox="0 0 560 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Person thinking about paying bills with a phone, a credit card, and an overdue bill">
                            <defs>
                                <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0" stop-color="#6366f1"/>
                                    <stop offset="1" stop-color="#8b5cf6"/>
                                </linearGradient>
                                <linearGradient id="payGrad" x1="0" y1="0" x2="1" y2="0">
                                    <stop offset="0" stop-color="#3b82f6"/>
                                    <stop offset="1" stop-color="#2563eb"/>
                                </linearGradient>
                                <linearGradient id="blobGrad" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0" stop-color="#818cf8"/>
                                    <stop offset="1" stop-color="#38bdf8"/>
                                </linearGradient>
                                <linearGradient id="coinGrad" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0" stop-color="#fbbf24"/>
                                    <stop offset="1" stop-color="#f59e0b"/>
                                </linearGradient>
                            </defs>

                            <!-- layered backdrop -->
                            <ellipse cx="305" cy="275" rx="215" ry="200" fill="url(#blobGrad)" opacity="0.14"/>
                            <circle cx="455" cy="105" r="85" fill="#38bdf8" opacity="0.12"/>
                            <circle cx="120" cy="420" r="70" fill="#818cf8" opacity="0.12"/>
                            <circle cx="105" cy="95" r="6" fill="#6366f1" opacity="0.35"/>
                            <circle cx="525" cy="300" r="5" fill="#f59e0b" opacity="0.45"/>
                            <path d="M515 200h12M521 194v12" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
                            <path d="M40 330h10M45 325v10" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

                            <!-- thinking character -->
                            <g id="figure" transform="translate(-16,0)">
                                <circle cx="92" cy="238" r="25" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
                                <path d="M92 263c-24 0-38 14-42 34l-4 22h34z" fill="#6366f1"/>
                                <path d="M92 263c24 0 38 14 42 34l4 22H96z" fill="#4f46e5"/>
                                <path d="M92 319v58" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
                                <path d="M92 377l-18 44M92 377l20 44" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
                                <path d="M126 290c8-14 4-32-10-40" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
                                <path d="M116 250a14 14 0 0 1 12 8" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
                                <text x="38" y="180" fill="#6366f1" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="42">?</text>
                                <text x="142" y="140" fill="#818cf8" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="32">?</text>
                                <text x="10" y="105" fill="#a5b4fc" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="24">?</text>
                            </g>

                            <!-- phone -->
                            <g id="phone">
                                <rect x="216" y="58" width="200" height="348" rx="32" fill="#0f172a" opacity="0.14"/>
                                <rect x="208" y="50" width="200" height="348" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
                                <rect x="282" y="64" width="52" height="9" rx="4.5" fill="#e2e8f0"/>
                                <rect x="224" y="88" width="168" height="58" rx="14" fill="url(#blobGrad)"/>
                                <circle cx="248" cy="117" r="13" fill="#ffffff" opacity="0.25"/>
                                <text x="270" y="125" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="21" font-style="italic">Pay</text>
                                <text x="312" y="125" fill="#e0e7ff" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="21" font-style="italic">Pal</text>

                                <line x1="224" y1="246" x2="392" y2="246" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 5"/>

                                <rect x="224" y="298" width="168" height="48" rx="14" fill="url(#payGrad)"/>
                                <text x="308" y="328" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="16" text-anchor="middle">Pay now</text>

                                <path d="M298 368a4 4 0 0 1 4-4h12a4 4 0 0 1 3 6l-1.5 2.5V375a2.5 2.5 0 0 1-5 0v-2.5L309 370h-7a4 4 0 0 1-4-2z" fill="#94a3b8"/>
                                <rect x="300" y="375" width="16" height="6" rx="2" fill="#94a3b8"/>
                                <text x="322" y="378" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="9.5">Secure checkout</text>
                            </g>

                            <!-- credit card -->
                            <g id="credit-card">
                                <rect x="318" y="404" width="192" height="118" rx="18" fill="#0f172a" opacity="0.14"/>
                                <rect x="310" y="396" width="192" height="118" rx="18" fill="url(#cardGrad)"/>
                                <rect x="330" y="418" width="38" height="28" rx="6" fill="#fbbf24"/>
                                <path d="M336 418v28M344 418v28M352 418v28" stroke="#f59e0b" stroke-width="2"/>
                                <path d="M448 424c6-4 12-4 16 0M448 432c4-3 8-3 12 0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
                                <text x="334" y="478" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="13.5" letter-spacing="2">3218 5678 9012 3456</text>
                                <text x="334" y="500" fill="#c7d2fe" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="9.5" letter-spacing="3">CREDIT CARD</text>
                                <circle cx="482" cy="424" r="11" fill="#ffffff" opacity="0.25"/>
                                <circle cx="465" cy="424" r="11" fill="#ffffff" opacity="0.4"/>
                            </g>

                            <!-- overdue bill paper -->
                            <g id="bill-paper">
                                <rect x="52" y="86" width="86" height="104" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" transform="rotate(-8 95 138)"/>
                                <rect x="66" y="102" width="42" height="7" rx="3.5" fill="#cbd5e1" transform="rotate(-8 95 138)"/>
                                <rect x="66" y="118" width="58" height="5" rx="2.5" fill="#e2e8f0" transform="rotate(-8 95 138)"/>
                                <rect x="66" y="130" width="58" height="5" rx="2.5" fill="#e2e8f0" transform="rotate(-8 95 138)"/>
                                <rect x="66" y="142" width="40" height="5" rx="2.5" fill="#e2e8f0" transform="rotate(-8 95 138)"/>
                                <rect x="72" y="158" width="44" height="16" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="2" transform="rotate(-8 95 138)"/>
                                <text x="94" y="170" fill="#ef4444" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="10" letter-spacing="1.5" text-anchor="middle" transform="rotate(-8 95 138)">DUE</text>
                            </g>

                            <!-- coins -->
                            <g id="coins">
                                <ellipse cx="262" cy="470" rx="20" ry="8" fill="#f59e0b"/>
                                <ellipse cx="262" cy="460" rx="20" ry="8" fill="url(#coinGrad)"/>
                                <ellipse cx="262" cy="450" rx="20" ry="8" fill="url(#coinGrad)"/>
                                <ellipse cx="262" cy="450" rx="12" ry="4.5" fill="#fde68a"/>
                            </g>

                            <!-- notification bell -->
                            <g id="bell">
                                <circle cx="470" cy="118" r="27" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
                                <path d="M470 104a9 9 0 0 0-9 9v6l-3 5h24l-3-5v-6a9 9 0 0 0-9-9z" fill="#6366f1"/>
                                <path d="M466.5 128a3.5 3.5 0 0 0 7 0" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
                                <circle cx="492" cy="100" r="11" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/>
                                <text x="492" y="105" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="13" text-anchor="middle">2</text>
                            </g>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const revealEls = document.querySelectorAll('#meta-line, .lesson-label, .hero-title, .hero-subtitle, .idiom-card, #chips-line, .image-section, .ghost-number');

        function playIn() {
            if (!window.gsap) {
                revealEls.forEach((el) => {
                    el.style.opacity = '1';
                    el.style.transform = 'none';
                });
                document.querySelectorAll('#phone, #credit-card, #bell, #figure, #bill-paper, #coins').forEach((el) => {
                    el.style.opacity = '1';
                });
                return;
            }

            const tl = gsap.timeline({ defaults: { ease: 'power4.out' } });
            tl.to('#meta-line', { opacity: 1, y: -8, duration: 0.5, ease: 'back.out(1.7)' });
            tl.to('.lesson-label', { opacity: 1, duration: 0.4 }, '-=0.3');
            tl.fromTo('.hero-title',
                { y: 40, opacity: 0, filter: 'blur(10px)' },
                { y: 0, opacity: 1, filter: 'blur(0px)', duration: 0.7 }, '-=0.25');
            tl.to('.hero-subtitle', { opacity: 1, y: -8, duration: 0.5, ease: 'power3.out' }, '-=0.4');
            tl.fromTo('.idiom-card',
                { y: 24, opacity: 0, scale: 0.96 },
                { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: 'power3.out' }, '-=0.35');
            tl.to('#chips-line', { opacity: 1, duration: 0.5 }, '-=0.3');
            tl.to('.ghost-number', { opacity: 1, duration: 0.8 }, '-=0.5');
            tl.fromTo('.image-section',
                { opacity: 0, scale: 0.92 },
                { opacity: 1, scale: 1, duration: 0.8, ease: 'expo.out' }, '-=0.7');
            tl.fromTo(['#phone', '#credit-card', '#bell', '#figure', '#bill-paper', '#coins'],
                { opacity: 0, y: 26, scale: 0.9 },
                { opacity: 1, y: 0, scale: 1, duration: 0.7, stagger: 0.09, ease: 'back.out(1.6)' }, '-=0.55');

            startIdleMotion();

            window.resetSlide = () => {
                tl.pause(0);
                gsap.killTweensOf('#credit-card, #bell, #figure, #figure text, #bill-paper, #coins, .ghost-number');
                gsap.set('#meta-line, .lesson-label, .hero-title, .hero-subtitle, .idiom-card, #chips-line, .image-section, .ghost-number, #phone, #credit-card, #bell, #figure, #bill-paper, #coins', { clearProps: 'all' });
                tl.restart();
                startIdleMotion();
            };
        }

        function startIdleMotion() {
            if (!window.gsap) return;
            gsap.to('#credit-card', { y: -11, rotation: -1.5, duration: 2.6, repeat: -1, yoyo: true, ease: 'sine.inOut' });
            gsap.to('#bell', { y: -7, duration: 2, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 0.3 });
            gsap.to('#figure', { y: -4, duration: 2.4, repeat: -1, yoyo: true, ease: 'sine.inOut' });
            gsap.to('#figure text', { y: -8, opacity: 0.35, duration: 1.3, repeat: -1, yoyo: true, stagger: 0.35, ease: 'sine.inOut' });
            gsap.to('#bill-paper', { y: -8, rotation: -11, duration: 2.8, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 0.6 });
            gsap.to('#coins', { y: -5, duration: 2.2, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 0.15 });
            gsap.to('#bell circle:last-of-type', { scale: 1.25, transformOrigin: 'center', duration: 0.8, repeat: -1, yoyo: true, ease: 'sine.inOut' });
        }

        playIn();
    });
</script>
</body>
</html>
